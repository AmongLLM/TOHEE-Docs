name: Deploy main preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# All Pages writers share this queue, including PR deployment and removal.
concurrency:
  group: tohee-docs-pages-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the latest trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Record the checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and test
        run: |
          npm ci
          npm test

      - name: Build main documentation preview
        env:
          DOCS_PREVIEW_BASE_PATH: /${{ github.event.repository.name }}/main/
          DOCS_PREVIEW_VERSION: ${{ steps.revision.outputs.sha }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: |
          npm run preview:build -- --base-href "$DOCS_PREVIEW_BASE_PATH"
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          await writeFile('dist/preview/preview-info.json', JSON.stringify({
            builtAt: new Date().toISOString(),
            revision: process.env.DOCS_PREVIEW_VERSION,
          }, null, 2) + '\n');
          JS

      - name: Check out Pages previews
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: .pages-preview-tree
          token: ${{ secrets.PAGES_PREVIEW_TOKEN }}
          persist-credentials: true

      - name: Update main preview and Pages directory
        run: |
          mkdir -p .pages-preview-tree/main
          rsync -a --delete dist/preview/ .pages-preview-tree/main/
          node scripts/build-preview-directory.mjs .pages-preview-tree "$RUNNER_TEMP/pages-preview-directory"
          cp -a "$RUNNER_TEMP/pages-preview-directory/." .pages-preview-tree/
          git -C .pages-preview-tree add -A -- main index.html fonts
          if ! git -C .pages-preview-tree diff --cached --quiet; then
            git -C .pages-preview-tree \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update main docs preview and directory'
            git -C .pages-preview-tree push origin HEAD:gh-pages
          else
            echo "No Pages changes to publish."
          fi
