name: Deploy PR Preview

on:
  workflow_run:
    workflows: [Build PR Preview]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: tohee-docs-pages-publish
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # GITHUB_SHA on workflow_run belongs to the default branch.
      - name: Checkout trusted default-branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the triggering run's artifact outside the checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-preview-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr-preview

      - name: Validate PR identity and reject workflow changes
        id: validate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREVIEW_ARTIFACT: ${{ runner.temp }}/pr-preview
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const meta = JSON.parse(fs.readFileSync(path.join(process.env.PREVIEW_ARTIFACT, 'preview-meta.json'), 'utf8'));
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            core.setOutput('decision', 'skip');

            if (run.repository.full_name !== repository || run.path !== '.github/workflows/pr-preview-build.yml') {
              throw new Error('Unexpected build workflow or repository');
            }
            if (!Number.isSafeInteger(meta.number) || meta.number <= 0
                || typeof meta.head_sha !== 'string' || !/^[0-9a-f]{40}$/.test(meta.head_sha)
                || !['opened', 'reopened', 'synchronize', 'closed'].includes(meta.event_action)) {
              throw new Error('Invalid preview metadata');
            }
            if (meta.head_sha !== run.head_sha) {
              throw new Error('Artifact SHA does not match the triggering workflow run');
            }
            if (run.pull_requests.length && !run.pull_requests.some(pr => pr.number === meta.number)) {
              throw new Error('Artifact PR does not match the triggering workflow run');
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: meta.number });
            if (pr.base.repo.full_name !== repository
                || pr.head.repo?.id !== run.head_repository.id || pr.head.ref !== run.head_branch) {
              throw new Error('PR repository or branch does not match the build');
            }
            if (pr.head.sha !== run.head_sha) {
              core.info('Skipping an outdated PR build');
              return;
            }

            // GitHub caps this endpoint at 3,000 files. A partial list must
            // never count as proof that .github/workflows was untouched.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: meta.number, per_page: 100
            });
            if (files.length !== pr.changed_files) {
              throw new Error('Cannot verify the complete PR file list');
            }
            const workflowChanges = files.filter(file =>
              [file.filename, file.previous_filename].some(filePath =>
                filePath === '.github/workflows' || filePath?.startsWith('.github/workflows/')));
            if (workflowChanges.length) {
              throw new Error('Preview rejected: PR changes .github/workflows: '
                + workflowChanges.map(file => file.filename).join(', '));
            }
            const { data: checkedPr } = await github.rest.pulls.get({ owner, repo, pull_number: meta.number });
            if (checkedPr.head.sha !== pr.head.sha || checkedPr.base.sha !== pr.base.sha
                || checkedPr.state !== pr.state || checkedPr.changed_files !== pr.changed_files) {
              throw new Error('PR changed while its files were being verified; rerun the latest build');
            }

            const decision = meta.event_action === 'closed'
              ? (pr.state === 'closed' ? 'remove' : 'skip')
              : (pr.state === 'open' ? 'deploy' : 'skip');
            core.info(`PR #${pr.number}: ${decision}`);
            core.setOutput('number', String(pr.number));
            core.setOutput('decision', decision);

      - name: Validate static frontend files without executing them
        if: steps.validate.outputs.decision == 'deploy'
        env:
          PREVIEW_ARTIFACT: ${{ runner.temp }}/pr-preview
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['PREVIEW_ARTIFACT']) / 'site'
          if root.is_symlink() or not root.is_dir():
              raise SystemExit('Missing static frontend directory')
          for item in root.rglob('*'):
              relative = item.relative_to(root)
              if item.is_symlink() or any(part in ('.git', '.github', '.ssh') for part in relative.parts):
                  raise SystemExit(f'Forbidden artifact path: {relative}')
          for name in ('index.html', 'docs/manifest.json'):
              if not (root / name).is_file():
                  raise SystemExit(f'Missing {name}')
          print('Static frontend artifact verified')
          PY

      - name: Record the verified preview build time
        if: steps.validate.outputs.decision == 'deploy'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREVIEW_ARTIFACT: ${{ runner.temp }}/pr-preview
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const run = context.payload.workflow_run;
            fs.writeFileSync(path.join(process.env.PREVIEW_ARTIFACT, 'site', 'preview-info.json'), JSON.stringify({
              builtAt: run.updated_at,
              revision: run.head_sha,
            }, null, 2) + '\n');

      - name: Check out Pages previews
        if: steps.validate.outputs.decision != 'skip'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: .pages-preview-tree
          token: ${{ secrets.PAGES_PREVIEW_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js for the trusted directory generator
        if: steps.validate.outputs.decision != 'skip'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Publish PR preview and Pages directory together
        id: publish
        if: steps.validate.outputs.decision != 'skip'
        env:
          PR_NUMBER: ${{ steps.validate.outputs.number }}
          PREVIEW_DECISION: ${{ steps.validate.outputs.decision }}
        run: |
          pages_tree=.pages-preview-tree
          preview_path="pr-preview/pr-$PR_NUMBER"
          if [[ "$PREVIEW_DECISION" == 'deploy' ]]; then
            mkdir -p "$pages_tree/$preview_path"
            rsync -a --delete "$RUNNER_TEMP/pr-preview/site/" "$pages_tree/$preview_path/"
            message="Deploy PR $PR_NUMBER preview and update directory"
          else
            if [[ ! -d "$pages_tree/$preview_path" ]]; then
              exit 0
            fi
            rm -rf -- "$pages_tree/$preview_path"
            message="Remove PR $PR_NUMBER preview and update directory"
          fi

          git -C "$pages_tree" add -A -- "$preview_path"
          if git -C "$pages_tree" diff --cached --quiet; then
            echo 'No Pages changes to publish.'
            exit 0
          fi
          node scripts/build-preview-directory.mjs "$pages_tree" "$RUNNER_TEMP/pages-preview-directory"
          cp -a "$RUNNER_TEMP/pages-preview-directory/." "$pages_tree/"
          git -C "$pages_tree" add -A -- index.html fonts
          git -C "$pages_tree" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$message"
          git -C "$pages_tree" push origin HEAD:gh-pages
          echo "sha=$(git -C "$pages_tree" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for the combined GitHub Pages deployment
        if: steps.publish.outputs.sha != ''
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.PAGES_PREVIEW_TOKEN }}
          PAGES_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          while true; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq ". | select(.commit == \"$PAGES_SHA\") | .status")
            case "$status" in
              built) break ;;
              errored) echo "Pages build failed for $PAGES_SHA" >&2; exit 1 ;;
            esac
            sleep 5
          done

      - name: Post or update the preview comment
        if: steps.validate.outputs.decision != 'skip'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.validate.outputs.number }}
          PREVIEW_DECISION: ${{ steps.validate.outputs.decision }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const previewUrl = `https://${owner.toLowerCase()}.github.io/${repo}/pr-preview/pr-${issue_number}/#/docs`;
            const marker = '<!-- tohee-docs-pr-preview -->';
            const body = process.env.PREVIEW_DECISION === 'deploy'
              ? `${marker}\n**PR Preview**\n\n[Open documentation preview](${previewUrl})\n\nAutomatically updated when this PR changes.`
              : `${marker}\n**PR Preview**\n\nPreview removed because the PR was closed.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
